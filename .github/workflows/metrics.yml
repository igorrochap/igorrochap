name: Metrics

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: ["master", "main"]
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/generate_wakatime_card.py"

jobs:
  wakatime:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate WakaTime card
        env:
          WAKATIME_SECRET: ${{ secrets.WAKATIME_SECRET }}
        run: python scripts/generate_wakatime_card.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wakatime.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update WakaTime card - [skip ci]"
          git push
